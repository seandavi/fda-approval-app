<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FDA Drug Approval Lookup</title>
    <meta
      name="description"
      content="Resolve drug names against FDA, RxNorm, NCI, and ClinicalTrials.gov to determine approval status."
    />
    <script type="module">
      const gaId = "G-KLLV1GCF4E";
      const host = location.hostname;
      const isProd = !(
        host === "localhost" ||
        host === "127.0.0.1" ||
        host === "[::1]" ||
        /^\d{1,3}(\.\d{1,3}){3}$/.test(host) ||
        host.includes(":") ||
        host.endsWith(".workers.dev") ||
        host.endsWith(".netlify.app") ||
        host.endsWith(".ts.net")
      );
      if (isProd) {
        const s = document.createElement("script");
        s.async = true;
        s.src = `https://www.googletagmanager.com/gtag/js?id=${gaId}`;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        window.gtag("js", new Date());
        window.gtag("config", gaId, { content_group: "fda-approvals" });
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
